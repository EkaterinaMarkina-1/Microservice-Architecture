events {
    worker_connections 1024;
}

http {
    upstream backend_upstream {
        server backend:8000;
    }

    upstream users_upstream {
        server users-api:8000;  # <- исправлено
    }

    server {
        listen 80;
        server_name localhost;

        # ================= BACKEND API =================
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================= USERS API =================
        location /users/ {
            rewrite ^/users/(.*)$ /$1 break;
            proxy_pass http://users_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================= BACKEND SWAGGER =================
        location /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
            proxy_set_header Host $host;
        }

        # ================= USERS SWAGGER =================
        location /users/docs {
            proxy_pass http://users_upstream/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /users;
        }

        location /users/openapi.json {
            proxy_pass http://users_upstream/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /users;
        }

        # ================= HEALTH =================
        location /health {
            proxy_pass http://backend_upstream/health;
        }

        location /users-health {
            proxy_pass http://users_upstream/health;
        }

        # ================= ROOT =================
        location = / {
            return 301 /docs;
        }
    }
}
