events {
    worker_connections 1024;
}

http {
    upstream backend_upstream {
        server backend:8000;
    }

    upstream users_upstream {
        server users_api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # ================= USERS SERVICE =================
        location /api/users/ {
            proxy_pass http://users_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================= BACKEND SERVICE =================
        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================= SWAGGER =================
        location /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
            proxy_set_header Host $host;
        }

        # ================= HEALTH =================
        location /health {
            proxy_pass http://backend_upstream/health;
        }

        location /users-health {
            proxy_pass http://users_upstream/health;
        }

        # ================= ROOT =================
        location = / {
            return 301 /docs;
        }
    }
}
